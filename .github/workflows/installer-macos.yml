name: macOS app

# Builds CozyClay.dmg from desktop/: an Electron window (its own Chromium, so Safari users are fine) that starts the
# newest cozyclay with the Node.js inside the app and shows the Studio in that window. No Terminal.
# The app is launched on the runner and has to load the Studio in its window before anything is uploaded.
# Signing needs MAC_CERT_P12 / MAC_CERT_PASSWORD (Developer ID Application) and notarization the App Store Connect
# key (ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID). Only a notarized build is for the site.
on:
  push:
    paths: ["desktop/**", ".github/workflows/installer-macos.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: v26.13.1

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Electron and electron-builder
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Portable Node.js for Apple silicon and Intel
        working-directory: desktop
        run: |
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/SHASUMS256.txt" -o SHASUMS256.txt
          for arch in arm64 x64; do
            name="node-${NODE_VERSION}-darwin-${arch}"
            curl -fsSLO "https://nodejs.org/dist/${NODE_VERSION}/${name}.tar.gz"
            grep " ${name}.tar.gz\$" SHASUMS256.txt | shasum -a 256 -c -
            tar -xzf "${name}.tar.gz"
            mkdir -p "vendor/node-${arch}"
            cp -R "${name}/bin" "${name}/lib" "vendor/node-${arch}/"
          done
          cp ../public/icons/icon-512.png build/icon.png
      - name: Signing keychain
        if: env.MAC_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/g2.cer" && security import "$RUNNER_TEMP/g2.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build CozyClay.app (universal)
        working-directory: desktop
        run: |
          if [ -n "$IDENTITY" ]; then export CSC_NAME="${IDENTITY#Developer ID Application: }"; else export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --mac dir --universal --publish never -c.extraMetadata.version="1.0.${GITHUB_RUN_NUMBER}"
          du -sh dist/mac-universal/CozyClay.app
          codesign -dv dist/mac-universal/CozyClay.app 2>&1 | grep -E "Authority|TeamIdentifier|flags" || true
      - name: The app opens the Studio in its window
        working-directory: desktop
        run: |
          APP="dist/mac-universal/CozyClay.app/Contents/MacOS/CozyClay"
          SMOKE="$RUNNER_TEMP/smoke.txt"
          COZYCLAY_DESKTOP_SMOKE="$SMOKE" "$APP" > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 120); do
            sleep 4
            [ -s "$SMOKE" ] && break
          done
          tail -40 "$HOME/Library/Logs/CozyClay/cozyclay.log" || true
          [ -s "$SMOKE" ] || { echo "the app window did not load the Studio"; tail -20 "$RUNNER_TEMP/app.log"; exit 1; }
          echo "Studio loaded in the app window:"; cat "$SMOKE"
          sleep 5
          if curl -fs -m 3 -o /dev/null http://127.0.0.1:5180/app/; then echo "quitting the app left the server running"; exit 1; fi
          echo "quitting the app stopped the server"
      - name: Notarize and staple the app
        if: env.IDENTITY != '' && env.ASC_KEY_P8 != ''
        working-directory: desktop
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          ditto -c -k --keepParent dist/mac-universal/CozyClay.app "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple dist/mac-universal/CozyClay.app
          spctl -a -t exec -vv dist/mac-universal/CozyClay.app
      - name: Disk image
        working-directory: desktop
        run: |
          mkdir dmg && cp -R dist/mac-universal/CozyClay.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname CozyClay -srcfolder dmg -ov -format UDZO dist/CozyClay.dmg
          ls -la dist/CozyClay.dmg
      - name: Sign, notarize and staple the disk image
        if: env.IDENTITY != '' && env.ASC_KEY_P8 != ''
        working-directory: desktop
        run: |
          codesign --force --timestamp -s "$IDENTITY" dist/CozyClay.dmg
          xcrun notarytool submit dist/CozyClay.dmg --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple dist/CozyClay.dmg
          spctl -a -t open --context context:primary-signature -v dist/CozyClay.dmg
          shasum -a 256 dist/CozyClay.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASC_KEY_P8 != '' && 'CozyClay-dmg' || 'CozyClay-dmg-not-notarized' }}
          path: desktop/dist/CozyClay.dmg
          if-no-files-found: error
